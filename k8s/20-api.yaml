apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: three-tier
spec:
  type: ClusterIP
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: three-tier
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, tier: backend }
    spec:
      volumes:
        - name: app-logs          # shared volume between the api and log-sidecar containers
          emptyDir: {}
      containers:
        - name: api
          image: kaj1/three-tier-api:1.1.0
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "1.1.0"
            - name: DB_HOST
              value: mysql
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secret, key: MYSQL_PASSWORD } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
        - name: log-sidecar
          image: busybox:1.36
          command: ["sh", "-c", "touch /var/log/app/access.log; tail -F /var/log/app/access.log"]
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits:   { cpu: 50m, memory: 32Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
