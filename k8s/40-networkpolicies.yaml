# 1. Deny all ingress and egress for every pod in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-all, namespace: three-tier }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2. Allow DNS lookups for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns-egress, namespace: three-tier }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 3. Anyone may reach the web pods on 8080 (the LoadBalancer path)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-to-web, namespace: three-tier }
spec:
  podSelector: { matchLabels: { app: web } }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
---
# 4. web may send traffic to api:3000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: web-egress-to-api, namespace: three-tier }
spec:
  podSelector: { matchLabels: { app: web } }
  policyTypes: [Egress]
  egress:
    - to: [ { podSelector: { matchLabels: { app: api } } } ]
      ports: [ { protocol: TCP, port: 3000 } ]
---
# 5. api accepts traffic only from web
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-ingress-from-web, namespace: three-tier }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Ingress]
  ingress:
    - from: [ { podSelector: { matchLabels: { app: web } } } ]
      ports: [ { protocol: TCP, port: 3000 } ]
---
# 6. api may send traffic to mysql:3306
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-egress-to-mysql, namespace: three-tier }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Egress]
  egress:
    - to: [ { podSelector: { matchLabels: { app: mysql } } } ]
      ports: [ { protocol: TCP, port: 3306 } ]
---
# 7. mysql accepts traffic only from api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mysql-ingress-from-api, namespace: three-tier }
spec:
  podSelector: { matchLabels: { app: mysql } }
  policyTypes: [Ingress]
  ingress:
    - from: [ { podSelector: { matchLabels: { app: api } } } ]
      ports: [ { protocol: TCP, port: 3306 } ]
